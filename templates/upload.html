{% extends "base.html" %}
{% block title %}Upload — Fitness Tracker{% endblock %}
{% block content %}
<h1 class="mb-4">Upload Fitness Screenshot</h1>
<p class="text-muted">Upload a screenshot from Google Fit, Fitbit, Apple Health, or any fitness app.
  The AI will extract workout data automatically.</p>

<div class="card p-4" style="max-width: 600px">
  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label for="image" class="form-label">Screenshot</label>
      <input type="file" class="form-control" name="image" id="image"
             accept="image/png,image/jpeg,image/gif,image/webp" required>
    </div>
    <button type="submit" class="btn btn-primary">Analyze & Save</button>
  </form>
</div>
{% endblock %}
